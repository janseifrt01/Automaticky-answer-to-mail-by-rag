<div id="settings-form" class="bg-white border rounded p-4">
  <h2 class="font-medium mb-2">Reply behavior</h2>
  {% if saved %}<p class="text-sm text-green-700 mb-2">Saved.</p>{% endif %}
  <form hx-post="/settings" hx-target="#settings-form" hx-swap="outerHTML" class="space-y-3 text-sm">
    <div>
      <label class="block font-medium">Reply mode</label>
      <label class="mr-4"><input type="radio" name="reply_mode" value="pilot"
        {% if settings.reply_mode == 'pilot' %}checked{% endif %}> Pilot (review first)</label>
      <label><input type="radio" name="reply_mode" value="auto"
        {% if settings.reply_mode == 'auto' %}checked{% endif %}> Auto (send when guards pass)</label>
    </div>
    <div>
      <label class="block font-medium">Confidence gate: {{ '%.2f' % settings.confidence_threshold }}</label>
      <input type="range" name="confidence_threshold" min="0" max="1" step="0.05"
             value="{{ settings.confidence_threshold }}" class="w-64">
    </div>
    <div>
      <label class="block font-medium">Auto-send keywords (comma-separated)</label>
      <input name="auto_send_keywords" class="w-full border rounded p-1"
             value="{{ (settings.auto_send_rules.keywords | join(', ')) if settings.auto_send_rules and settings.auto_send_rules.keywords else '' }}">
    </div>
    <button class="px-3 py-1 rounded bg-blue-600 text-white">Save</button>
  </form>
</div>
