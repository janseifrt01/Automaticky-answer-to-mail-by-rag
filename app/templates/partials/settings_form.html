<div id="settings-form" class="bg-white border rounded p-4">
  <h2 class="font-medium mb-2">Reply behavior</h2>
  {% if saved %}<p class="text-sm text-green-700 mb-2">Saved.</p>{% endif %}
  <form hx-post="/settings" hx-target="#settings-form" hx-swap="outerHTML" class="space-y-3 text-sm">
    <div>
      <label class="block font-medium">Reply mode</label>
      <label class="mr-4"><input type="radio" name="reply_mode" value="pilot"
        {% if settings.reply_mode == 'pilot' %}checked{% endif %}> Pilot (review first)</label>
      <label><input type="radio" name="reply_mode" value="auto"
        {% if settings.reply_mode == 'auto' %}checked{% endif %}> Auto (send when guards pass)</label>
    </div>
    <div>
      <label class="block font-medium">Confidence gate: {{ '%.2f' % settings.confidence_threshold }}</label>
      <input type="range" name="confidence_threshold" min="0" max="1" step="0.05"
             value="{{ settings.confidence_threshold }}" class="w-64">
    </div>
    <div>
      <label class="block font-medium">Auto-send keywords (comma-separated)</label>
      <input name="auto_send_keywords" class="w-full border rounded p-1"
             value="{{ (settings.auto_send_rules.keywords | join(', ')) if settings.auto_send_rules and settings.auto_send_rules.keywords else '' }}">
    </div>
    <div>
      <label class="block font-medium">Reply model provider</label>
      <select name="llm_provider" class="border rounded p-1">
        <option value="openai" {% if (settings.llm_provider or 'openai') == 'openai' %}selected{% endif %}>OpenAI</option>
        <option value="anthropic" {% if settings.llm_provider == 'anthropic' %}selected{% endif %}>Anthropic (Claude / Haiku)</option>
        <option value="github_models" {% if settings.llm_provider == 'github_models' %}selected{% endif %}>GitHub Models</option>
      </select>
    </div>
    <div>
      <label class="block font-medium">Generation model <span class="text-gray-500 font-normal">(optional override)</span></label>
      <input name="generation_model" class="w-full border rounded p-1"
             placeholder="e.g. claude-haiku-4-5 · gpt-4o-mini · openai/gpt-4o-mini"
             value="{{ settings.generation_model or '' }}">
    </div>
    <div>
      <label class="block font-medium">Embedding provider</label>
      <select name="embedding_provider" class="border rounded p-1">
        <option value="openai" {% if (settings.embedding_provider or 'openai') == 'openai' %}selected{% endif %}>OpenAI</option>
        <option value="github_models" {% if settings.embedding_provider == 'github_models' %}selected{% endif %}>GitHub Models</option>
        <option value="fastembed" {% if settings.embedding_provider == 'fastembed' %}selected{% endif %}>Local (fastembed)</option>
      </select>
      <p class="text-xs text-gray-500 mt-1">Claude has no embeddings API — KB indexing/search uses this provider. "Local (fastembed)" runs offline, no key. Switching providers changes the vector dimension — rebuild the index on the Knowledge Base page afterwards.</p>
    </div>
    <button class="px-3 py-1 rounded bg-blue-600 text-white">Save</button>
  </form>
</div>
